---
name: Bug Report
description: Report something that isn't working correctly
title: "[Bug] <short description>"
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: OS, browser, Laravel/PHP version, DB used, etc.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes or Screenshots
      description: Include logs, screenshots, or extra context if needed.
    validations:
      required: false
