---
name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] <short description>"
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to Solve
      description: What are you trying to solve or improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to see implemented?
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: How would this feature help the project or users?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any other solutions?
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context or mockups
      description: Add screenshots, diagrams, or links to related issues.
    validations:
      required: false
